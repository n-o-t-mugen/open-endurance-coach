name: Feature request
description: Propose a new feature or a change in behaviour
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing an improvement. Please search [existing issues](https://github.com/yannvillellas/open-endurance-coach/issues) first — including closed ones — to avoid duplicates. One issue per proposal.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checklist
      options:
        - label: I have searched the existing issues and this proposal is not a duplicate
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of the problem or limitation.
      placeholder: I'm always frustrated when ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you would like
      description: What should happen instead?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you have considered
      description: Other solutions or workarounds you thought about.
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How would we know the feature is done? Bullet points help.
      placeholder: |
        - [ ] ...
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else (screenshots, links, related issues).
    validations:
      required: false
